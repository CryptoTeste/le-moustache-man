/* ---------- Revelação (reveal ceremony) ----------
   Plays once per phone for each sealed ballot, in ceremony order (mascot, then Best Moustache).
   Online, it will pop up on every phone the moment the Committee seals the vote. */
const SEEN_KEY='bigode-premium-seen';
function seenSet(){try{return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||'[]'))}catch(e){return UI.seenMem||(UI.seenMem=new Set())}}
function markSeen(key){const s=seenSet();s.add(key);try{localStorage.setItem(SEEN_KEY,JSON.stringify([...s]))}catch(e){UI.seenMem=s}}
const revealKey=k=>`${ME}-${S.edition.year}-${k}-${S.ballots[k].round||1}-${Object.keys(S.ballots[k].votes||{}).length}`;
let ceremonyOn=false;
function checkReveals(){
  if(ceremonyOn||!me())return;
  for(const k of ['mascote','bigode']){const b=S.ballots[k];if(b.revealed&&!seenSet().has(revealKey(k))&&!seenSet().has(yearKey(k,S.edition.year))){playReveal(k);return}}
  // Missed the live reveal? Show the last closed edition's ceremony once (up to 45 days after closing)
  const h=S.history[S.history.length-1];
  if(h&&h.results&&h.closedAt&&Date.now()-h.closedAt<45*864e5)
    for(const k of ['mascote','bigode']){if(h.results[k]&&!seenSet().has(yearKey(k,h.year))){playReveal(k,false,h);return}}
}
const yearKey=(k,y)=>`${ME}-${y}-${k}-seen`;
const STACHE_PATH='M32 9.5c-2.6-4.6-8.4-6.6-13.2-4.2-3.8 1.9-5.6 5.6-9.6 5.6-2.8 0-4.6-1.6-5.7-3.6-.4 5.6 4.3 10.4 11 10.4 7.3 0 12.2-4.3 17.5-6 5.3 1.7 10.2 6 17.5 6 6.7 0 11.4-4.8 11-10.4-1.1 2-2.9 3.6-5.7 3.6-4 0-5.8-3.7-9.6-5.6C40.4 2.9 34.6 4.9 32 9.5z';
function confetti(canvas,amount,dur){
  const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,W=canvas.clientWidth,H=canvas.clientHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;ctx.scale(dpr,dpr);
  const st=new Path2D(STACHE_PATH),cols=['#C9A45C','#E2C27F','#ECE4D3','#B33A4C'];
  const ps=Array.from({length:amount},()=>({x:Math.random()*W,y:-30-Math.random()*H*.7,vx:(Math.random()-.5)*1.4,vy:1.6+Math.random()*2.6,r:Math.random()*6.3,vr:(Math.random()-.5)*.12,
    s:.3+Math.random()*.4,stache:Math.random()<.4,c:cols[Math.floor(Math.random()*cols.length)],w:4+Math.random()*5,h:9+Math.random()*9,sw:Math.random()*6.3}));
  const t0=performance.now();
  (function f(t){const el=t-t0;ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.sw+=.05;p.x+=p.vx+Math.sin(p.sw)*.7;p.y+=p.vy;p.r+=p.vr;
      if(p.y>H+30&&el<dur-1800){p.y=-30;p.x=Math.random()*W}
      ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,(dur-el)/700));ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      if(p.stache){ctx.scale(p.s,p.s);ctx.translate(-32,-12);ctx.fill(st)}else{ctx.scale(1,Math.cos(p.sw*2));ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
      ctx.restore()});
    if(el<dur&&canvas.isConnected)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H)})(t0);
}
async function playReveal(k,replay,hist){
  ceremonyOn=true;
  // Live ballot, or the saved result of a closed edition
  const R=hist?hist.results[k]:null;
  const c=R?R.counts:tally(S.ballots[k]),names=R?R.names||{}:{};
  const nameOf=id=>S.people[id]?S.people[id].name:(names[id]||'—');
  const mx=Math.max(0,...Object.values(c)),L=mx?Object.keys(c).filter(id=>c[id]===mx):[];
  const B=BALLOT[k],tie=L.length!==1,m=me();
  const win=tie?null:(P(L[0])||{id:L[0],name:nameOf(L[0])}),mine=!!win&&win.id===m.id;
  const rows=Object.keys(c).filter(id=>c[id]).sort((x,y)=>c[x]-c[y]);
  const max=Math.max(1,...rows.map(id=>c[id])),total=Object.values(c).reduce((a,x)=>a+x,0);
  const seenKey=hist?yearKey(k,hist.year):revealKey(k);
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el=document.createElement('div');el.className='ceremony force-dark';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Revelação: '+B.t1+' '+B.t2);
  const barHTML=id=>`<div class="cer-bar" data-id="${id}"><div class="lab"><span>${esc(nameOf(id))}</span><b>0</b></div><div class="track"><div class="fill"></div></div></div>`;
  el.innerHTML=`<canvas class="confetti" aria-hidden="true"></canvas><button class="txt-btn cer-skip" data-cer="skip">Saltar</button>
    <div class="cer-in">
      <div class="cer-head"><span class="eyebrow">${hist?'Jantar '+roman(hist.year)+' · ':''}A urna foi selada · ${B.art}</span><h2 class="title-sm">${B.t1} <em>${B.t2}</em></h2><span class="note">${total} ${total===1?'voto':'votos'}</span></div>
      <div class="cer-bars">${rows.map(barHTML).join('')}</div>
      <div class="cer-stage"></div>
    </div>`;
  document.body.appendChild(el);
  let skipped=false;const waiters=[];
  const wait=ms=>new Promise(r=>{if(skipped||reduce)return r();const t=setTimeout(r,ms);waiters.push(()=>{clearTimeout(t);r()})});
  const bars=el.querySelector('.cer-bars'),stage=el.querySelector('.cer-stage');
  const fillBar=(id,instant)=>{const bar=bars.querySelector(`[data-id="${id}"]`);if(!bar)return;const n=c[id];bar.querySelector('.fill').style.width=(n/max*100)+'%';
    const out=bar.querySelector('b');if(instant){out.textContent=n;return}const t0=performance.now();
    (function step(t){const q=Math.min(1,(t-t0)/850);out.textContent=Math.round(n*q);if(q<1&&!skipped)requestAnimationFrame(step);else out.textContent=n})(t0)};
  const finish=()=>{
    rows.forEach(id=>fillBar(id,true));
    L.forEach(id=>{const x=bars.querySelector(`[data-id="${id}"]`);if(x)x.classList.add('lead')});
    bars.classList.remove('dim');bars.classList.add('final');
    if(tie){stage.innerHTML=`<div class="cer-win"><div class="cer-tie">Empate!</div><div class="cer-sub">${L.map(id=>esc(nameOf(id))).join(' · ')}</div><p class="note">Prevalece o bom senso; na sua falta, nova votação (Art. 16.º).</p></div>`}
    else{stage.innerHTML=`<div class="cer-win">${mine?'<span class="cer-you">É você!</span>':''}${portrait(win,k==='mascote'?'green':'')}
      <div class="cer-name">${esc(win.name)}</div>
      <div class="cer-sub">${k==='bigode'?'Melhor Bigode do Ano · recebe o Laço-Testemunho':'Nova Mascote do Bigode · convite vitalício'}</div>
      <div class="cer-votes">${c[win.id]} de ${total} votos</div></div>`;
      if(!reduce)confetti(el.querySelector('.confetti'),mine?190:120,mine?7000:5200)}
    stage.after(bars);
    el.querySelector('.cer-skip').hidden=true;
    const go=document.createElement('button');go.className='btn brass cer-go';go.dataset.cer='close';go.textContent='Continuar';bars.after(go);go.focus({preventScroll:true});
  };
  el.addEventListener('click',ev=>{const a=ev.target.closest('[data-cer]');if(!a)return;
    if(a.dataset.cer==='skip'){skipped=true;waiters.splice(0).forEach(f=>f())}
    if(a.dataset.cer==='close'){if(!replay){markSeen(seenKey);markSeen(yearKey(k,hist?hist.year:S.edition.year))}el.remove();ceremonyOn=false;render();}});
  // The sequence: lowest votes first, building suspense towards the top
  await wait(900);
  for(const id of rows){if(skipped)break;fillBar(id);await wait(rows.length>5?650:1000)}
  if(!skipped&&!reduce){await wait(700);bars.classList.add('dim');
    stage.innerHTML=`<div class="cer-drum">${tie?'Temos um':'E o vencedor é'}<i>.</i><i>.</i><i>.</i></div>`;await wait(1900)}
  finish();
}

/* ---------- Novidades: a dot on a tab when something new arrived there since you last looked ----------
   Only things other people did count. Remembered per phone. */
const SEEN_TABS='lmm-seen-tabs';
function seenTabs(){try{return JSON.parse(localStorage.getItem(SEEN_TABS)||'null')}catch(e){return UI.seenTabsMem||null}}
function saveSeenTabs(o){try{localStorage.setItem(SEEN_TABS,JSON.stringify(o))}catch(e){UI.seenTabsMem=o}}
function latestNews(tab){
  let t=0;const up=(v,by)=>{if(v&&by!==ME&&v>t)t=v};const y=S.edition.year,e=S.edition;
  if(tab==='jantar'){
    Object.values(S.notes||{}).forEach(n=>n.year===y&&up(n.at,n.by));
    Object.values(S.files||{}).forEach(f=>f.kind!=='group'&&f.year===y&&up(f.at,f.by));
    Object.values(S.media||{}).forEach(x=>x.year===y&&up(x.at,x.by));
    up(e.updatedAt,e.updatedBy);
  }else if(tab==='votar'){
    Object.values(S.people||{}).forEach(p=>p.role==='convidado'&&up(p.at,p.nominatedBy));
    ['mascote','bigode'].forEach(k=>{const b=S.ballots[k]||{};up(b.openedAt,b.openedBy);up(b.revealedAt,b.revealedBy)});
  }else if(tab==='galeria'){
    (S.history||[]).forEach(h=>{up(h.closedAt,h.closedBy);up(h.updatedAt,h.updatedBy)});
    Object.values(S.files||{}).forEach(f=>f.kind==='group'&&up(f.at,f.by));
  }
  return t;
}
function newsTabs(current){
  let seen=seenTabs();const now=Date.now();
  if(!seen){seen={jantar:now,votar:now,galeria:now};saveSeenTabs(seen)}   // first visit: start clean
  if(current&&['jantar','votar','galeria'].includes(current)&&latestNews(current)>=(seen[current]||0)){seen[current]=now;saveSeenTabs(seen)}
  const out={};['jantar','votar','galeria'].forEach(k=>{out[k]=k!==current&&latestNews(k)>(seen[k]||0)});
  // The number on the home-screen icon (where the phone allows it)
  const n=Object.values(out).filter(Boolean).length;
  try{if(navigator.setAppBadge){n?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch(e){}
  return out;
}

function themePref(){try{const t=localStorage.getItem('lmm-theme');return t==='light'||t==='dark'?t:'system'}catch(e){return 'system'}}
function setTheme(t){
  try{t==='system'?localStorage.removeItem('lmm-theme'):localStorage.setItem('lmm-theme',t)}catch(e){}
  const root=document.documentElement;t==='system'?root.removeAttribute('data-theme'):root.setAttribute('data-theme',t);
  const dark=t==='dark'||(t==='system'&&!(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches));
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content',t==='system'?(m.media.includes('light')?'#F4F1EA':'#0E0D0B'):(dark?'#0E0D0B':'#F4F1EA')));
}

function vPerfil(){

  const wins=S.history.filter(h=>h.bigode===m.id).map(h=>h.year);
  const recorded=S.history.filter(h=>Array.isArray(h.attended)&&h.year>=m.since).slice().sort((a,b)=>b.year-a.year);
  const went=recorded.filter(h=>h.attended.includes(m.id));
  const rate=recorded.length?Math.round(went.length/recorded.length*100):null;

    <button class="btn" data-a="logout">${ONLINE?'Sair deste telemóvel':'Sair'}</button></section>`;

  $('#meBtn').hidden=!m;

  document.querySelector('.tabs').hidden=!m;
  const news=m?newsTabs(r):{};
  $('#tabs').innerHTML=m?TABS.filter(([k])=>k!=='comissao'||m.committee).map(([k,l])=>`<a href="#${k}" class="${r===k?'on':''}" ${r===k?'aria-current="page"':''} ${news[k]?`aria-label="${l.charAt(0)+l.slice(1).toLowerCase()}, com novidades"`:''}>${ICON[k]}${news[k]?'<span class="new" aria-hidden="true"></span>':''}${l}</a>`).join(''):'';
  const active=document.activeElement&&document.activeElement.id;
  const app=$('#app'),changed=UI.lastRoute!==(m?r:'who');UI.lastRoute=m?r:'who';
  app.innerHTML=!m?vWho():({jantar:vJantar,votar:vVotar,galeria:vGaleria,regras:vRegras,comissao:vComissao}[r])();

/* ---------- Bottom sheets (profile, photos, archive) ---------- */
function closeLayer(after){
  const L=$('#layer'),sh=L.querySelector('.sheet'),sc=L.querySelector('.scrim');
  if(!sh){L.innerHTML='';after&&after();return}
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  sh.style.transform='';sh.classList.add('out');sc&&sc.classList.add('out');
  setTimeout(()=>{L.innerHTML='';after&&after()},reduce?0:280);
}
// Drag a sheet down from its top to close it
function attachDrag(sh,onClose){
  let y0=null,dy=0;
  sh.addEventListener('touchstart',e=>{if(sh.scrollTop>0){y0=null;return}y0=e.touches[0].clientY;dy=0;sh.style.transition='none'},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);if(dy>0)sh.style.transform=`translateY(${dy}px)`},{passive:true});
  sh.addEventListener('touchend',()=>{if(y0===null)return;sh.style.transition='';if(dy>110)onClose();else sh.style.transform='';y0=null});
}
function openProfile(){
  if(UI.profileOpen||!me())return;
  UI.profileOpen=true;history.pushState({lmmSheet:'perfil'},'');
  $('#layer').innerHTML=`<div class="scrim" data-a="closeprofile"><div class="sheet full" role="dialog" aria-modal="true" aria-label="O seu perfil">

    <div class="sheet-body">${vPerfil()}</div></div></div>`;

}

// Everything only the Committee may do. The online version enforces the same list on the server.
const COMMITTEE_ONLY=new Set(['phase','saveed','just','present','addcand','newcand','rmcand','allpresent','open','reveal','tiebreak','resetb',
  'edit','saveedit','askrm','rmok','addmember','askclose','closeok','askreset','resetok','addnote','rmnote','rmfile','askendnight','endnightok','copylink','newlink','addmascot','addhist','savehist','rmhist','histform','savehistform','hfnophoto']);
// Square-crop profile photos to 400px so they stay light
function squarePhoto(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=400;
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,400,400);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
document.addEventListener('change',async ev=>{
  const pid=ev.target.dataset&&ev.target.dataset.photo;
  if(pid){const f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;const m=me();

    try{const data=await squarePhoto(f);const prev=S.people[pid].photo;Store.set(`people.${pid}.photo`,data);
      if(!Store.persist()){Store.set(`people.${pid}.photo`,prev);Store.persist();toast('Sem espaço no modo de teste');return}

    return}
  if(ev.target.id==='hf-mascote'){$('#hf-newm-wrap').hidden=ev.target.value!=='__new';if(ev.target.value==='__new')$('#hf-newm').focus();return}
  if(ev.target.id==='hf-photo'){const f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;
    try{UI.histPhoto=await shrinkImage(f);$('#hf-preview').innerHTML=`<img class="group-photo" src="${UI.histPhoto}" alt="">`}catch(e){toast('Não foi possível ler a imagem')}return}
  if(ev.target.id==='media-in'){const fs=[...(ev.target.files||[])];ev.target.value='';if(fs.length)addMedia(fs);return}
  if(ev.target.id!=='file-in')return;

});

    case 'edit':UI.editing=id;UI.confirm=null;ui();return;
    case 'saveedit':{const n=$('#ed-name').value.trim();if(!n){toast('O nome não pode ficar vazio');return}UI.editing=null;const ch={[`people.${id}.name`]:n};const cb=$('#ed-com');if(cb&&m.admin&&!S.people[id].admin)ch[`people.${id}.committee`]=cb.checked;
      const ey=$('#ed-year');if(ey&&Number(ey.value))ch[`people.${id}.mascotYear`]=Number(ey.value);Store.setMany(ch);toast('Membro atualizado');return}
    case 'askrm':UI.confirm='rm-'+id;ui();return;
    case 'rmok':{UI.editing=null;UI.confirm=null;const ch={['people.'+id]:undefined,['rsvp.'+id]:undefined,['present.'+id]:undefined};['bigode','mascote'].forEach(x=>ch[`ballots.${x}.cands`]=S.ballots[x].cands.filter(c=>c!==id));Store.setMany(ch);if(ONLINE)Remote.dropKeys(id).catch(()=>{});toast('Membro removido');return}
    case 'addmascot':{const n=$('#new-mascot').value.trim(),y=Number($('#new-mascot-year').value);if(!n){toast('Escreva o nome');return}if(!y||y<1990||y>S.edition.year){toast('Ano inválido');return}
      const nid='g'+Date.now().toString(36),ch={['people.'+nid]:{name:n,role:'mascote',since:y,dinners:0,mascotYear:y}};
      const hs=S.history.slice(),h=hs.find(x=>x.year===y);
      if(h){if(!h.mascote){ch.history=hs.map(x=>x.year===y?Object.assign({},x,{mascote:nid}):x)}}else ch.history=hs.concat({year:y,mascote:nid,manual:true}).sort((a,b)=>a.year-b.year);
      Store.setMany(ch);if(ONLINE)Remote.addKey(nid).catch(()=>{});toast(n+' é mascote');return}
    case 'histform':histForm(v?Number(v):null);return;
    case 'savehistform':saveHistForm(el);return;
    case 'hfnophoto':UI.histPhoto=null;$('#hf-preview').innerHTML='<p class="note">A fotografia será removida ao guardar.</p>';el.remove();return;
    case 'addhist':{const y=Number($('#new-hist-year').value);if(!y||y<1990||y>=S.edition.year){toast('Ano inválido');return}if(S.history.some(h=>h.year===y)){toast(y+' já existe');return}
      Store.one('history',S.history.concat({year:y,manual:true}).sort((a,b)=>a.year-b.year));toast(y+' adicionado');return}
    case 'savehist':{const y=Number(v),d=$('#hd-'+y).value,bb=$('#hb-'+y).value,mm=$('#hm-'+y).value;
      const hs=S.history.map(h=>{if(h.year!==y)return h;const n=Object.assign({},h);d?n.date=d:delete n.date;bb?n.bigode=bb:delete n.bigode;mm?n.mascote=mm:delete n.mascote;return n});
      const ch={history:hs};if(mm&&S.people[mm]&&!S.people[mm].mascotYear)ch[`people.${mm}.mascotYear`]=y;Store.setMany(ch);toast(y+' guardado');return}
    case 'rmhist':{const y=Number(v);if(UI.confirm!=='rmh-'+y){UI.confirm='rmh-'+y;el.textContent='Confirmar?';el.style.color='var(--wine-ink)';return}
      UI.confirm=null;const gp=groupPhoto(y),ch={history:S.history.filter(h=>h.year!==y)};if(gp)ch['files.'+gp.id]=undefined;
      if($('#layer .sheet'))closeLayer();Store.setMany(ch);toast(y+' apagado');return}
    case 'addmember':{const n=$('#new-member').value.trim();if(!n)return;const no=Math.max(0,...all().map(p=>p.no||0))+1,nid='m'+Date.now().toString(36);Store.one('people.'+nid,{name:n,no,role:'membro',since:S.edition.year,dinners:0,committee:false,strikes:0});if(ONLINE)Remote.addKey(nid).catch(()=>toast('Sem permissão para criar o link'));toast(n+' admitido');return}
    case 'askclose':UI.confirm='close';ui();return;
    case 'askreset':UI.confirm='reset';ui();return;
    case 'cancel':UI.confirm=null;UI.editing=null;ui();return;
    case 'resetok':UI.confirm=null;Store.reset();ui();toast('Dados de exemplo repostos');return;
    case 'closeok':{
      const y=S.edition.year,bw=leaders(S.ballots.bigode)[0],mw=leaders(S.ballots.mascote)[0],ch={};
      const mt=tally(S.ballots.mascote),bt=tally(S.ballots.bigode);
      const nm=ids=>Object.fromEntries(ids.filter(i=>S.people[i]).map(i=>[i,S.people[i].name]));
      const results={mascote:{counts:mt,names:nm(Object.keys(mt))},bigode:{counts:bt,names:nm(Object.keys(bt))}};
      const proposed=S.ballots.mascote.cands.filter(c=>S.people[c]).map(c=>{const q=S.people[c];return {name:q.name,note:q.note||'',by:q.nominatedBy||null,votes:mt[c]||0,won:c===mw}});
      const inv=invited();
      ch.history=S.history.concat({year:y,date:S.edition.date,bigode:bw,mascote:mw,proposed,results,closedAt:Date.now(),closedBy:m.id,
        attended:presentIds(),absent:inv.filter(p=>status(p.id)==='nao'&&!S.present[p.id]).map(p=>p.id),
        silent:inv.filter(p=>(status(p.id)==='excluido'||status(p.id)==='pendente')&&!S.present[p.id]).map(p=>p.id)});
      S.ballots.mascote.cands.forEach(c=>{if(c!==mw&&S.people[c]&&S.people[c].role==='convidado')ch['people.'+c]=undefined});
      const mp=S.people[mw];ch[`people.${mw}.mascotYear`]=y;if(mp.role!=='membro')ch[`people.${mw}.role`]='mascote';
      presentIds().forEach(pid=>ch[`people.${pid}.dinners`]=(S.people[pid].dinners||0)+1);
      invited().forEach(p=>{if(status(p.id)==='excluido')ch[`people.${p.id}.strikes`]=(p.strikes||0)+1});
      const nd=D(S.edition.date);nd.setFullYear(y+1);const dd=new Date(nd);dd.setDate(dd.getDate()-14);
      ch.edition=Object.assign({},S.edition,{year:y+1,date:iso(nd),deadline:iso(dd),place:'Restaurante a confirmar',phase:'convocatoria'});
      ch.rsvp={};ch.present={};
      ['mascote','bigode'].forEach(x=>ch['ballots.'+x]={cands:[],open:false,revealed:false,votes:{},round:1});
      UI.confirm=null;Store.setMany(ch);toast('Edição '+y+' encerrada');location.hash='galeria';return}
  }
});
render();
if(ONLINE)Remote.start();
})();
</script>
</body>
</html>
